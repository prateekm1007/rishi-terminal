# Y2 (Round 12): the quote-cache warmer schedule.
#
# Why a GitHub Actions workflow: Vercel Hobby crons run at most once a day;
# the founder's Round-12 Y2 directions approve this free warmer. It calls
# the authenticated ingest endpoint every 15 minutes inside the NSE trading
# window (09:15-15:30 IST = 03:45-10:00 UTC) on weekdays.
#
# Schedule vs endpoint gating (defense in depth):
#   - cron fires 03:07-10:52 UTC on weekdays (the :15-offset window cannot
#     be expressed in cron's 5-field syntax, so the schedule is WIDER than
#     the session and the ENDPOINT gates precisely via marketState).
#   - R16 C4 repair (2026-10-05): the schedule had NEVER fired — zero
#     event=schedule runs (total_count=0) while the workflow was active on
#     main since Oct 4 and the 03:45/04:00/04:15/04:30 slots all passed
#     empty. Two changes: (a) this commit re-registers the schedule (a
#     default-branch change to the workflow file re-registers its cron),
#     and (b) the minutes shift OFF the :00/:15/:30/:45 boundaries to
#     :07/:22/:37/:52 — GitHub's documented guidance: "The schedule event
#     can be delayed during periods of high load ... To decrease the
#     chance of delay, schedule your workflow to run at a different time
#     of the hour." The old */15 form sat exactly on the worst spots.
#   - each run partitions the universe into 6 slices (916/6 ≈ 153 symbols
#     per request, well inside the function timeout) fired sequentially;
#     slice 0 also warms the index/crypto/gold tiles.
#   - the endpoint no-ops outside the session, so a misfired run is cheap.
#
# QUOTES_WARM_SECRET is a repo Actions secret holding the warmer's
# DEDICATED secret (Z2, Round 13) — set as a Vercel production env var of
# the same name. CRON_SECRET stays exclusive to the Vercel-cron ingest
# routes; neither secret opens the other's endpoint.

name: quotes-warm

on:
  schedule:
    - cron: "7-52/15 3-10 * * 1-5" # weekdays 03:07-10:52 UTC, off the high-load :00/:15/:30/:45 boundaries (R16 C4)
  workflow_dispatch: {} # manual runs for verification (endpoint gates market hours)

concurrency:
  group: quotes-warm
  cancel-in-progress: false # overlapping runs are safe (claim mechanism) — serialize anyway

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the quote cache (6 slices, paced)
        run: |
          set -euo pipefail
          BASE="https://rishi-terminal.vercel.app/api/ingest/quotes-warm"
          SLICES=6
          # Y2 follow-up: pace the slices ~75 s apart. Back-to-back slices
          # measured ~17% upstream 429 misses (Yahoo free tier throttles the
          # burst); spacing spreads the same request count across most of the
          # 15-minute window, and the next cycle retries whatever a cycle
          # misses (claims expire after 30 s). Total run stays under 10 min.
          for k in $(seq 0 $((SLICES - 1))); do
            if [ "$k" -gt 0 ]; then sleep 75; fi
            echo "== slice $k/$SLICES =="
            code=$(curl -s -o "/tmp/warm-$k.json" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.QUOTES_WARM_SECRET }}" \
              "$BASE?slice=$k&of=$SLICES")
            echo "HTTP $code"
            cat "/tmp/warm-$k.json"
            echo
            if [ "$code" != "200" ]; then
              echo "warm slice $k failed with HTTP $code"
              exit 1
            fi
          done
          echo "== warmer run complete =="
