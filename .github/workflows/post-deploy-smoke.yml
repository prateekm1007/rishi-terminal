# B1 (founder Round-15): post-deploy production smoke.
#
# Why a deployment_status workflow: the Playwright smoke job gates a LOCAL
# build in CI — it cannot catch the B-20/B-21 class ("merged" reported done
# while production still served the pre-fix build). This workflow runs the
# live probes against production exactly when a production deployment
# finishes, and goes RED if the deployed HTML lacks the first-byte content
# sections (Constitution v2 C6: done = merged + deployed + live).
#
#   deployment_status — Vercel's GitHub integration fires this for every
#     deployment; the job filters to environment "Production" and runs for
#     ANY completed state. C2 (founder Round 16, defect 2): the smoke must
#     run REGARDLESS of the cadence result and regardless of deployment
#     hiccups — a canceled/failed deployment leaves the PREVIOUS build
#     serving, and the probes then honestly report what production is
#     actually serving (version check without --expect-sha, content
#     anchors still asserted). Silent skips are how B-20/B-21 class
#     defects hide; the founder observed exactly such a skip on 9f8f729.
#   workflow_dispatch — manual/fail-first runs (rule 24: prove the gate
#     bites by running it with a deliberately missing section or against a
#     pre-fix local build).
#
# The expected SHA comes from the deployment itself (github.event.deployment.sha)
# when present, so the version check proves the deployment that JUST finished
# is the one serving traffic.

name: post-deploy-smoke

on:
  deployment_status: {}
  workflow_dispatch:
    inputs:
      expect_sha:
        description: "Require /api/version to serve exactly this sha (optional)"
        required: false
        default: ""

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live content smoke (production)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.deployment.environment, 'Production'))
    steps:
      - uses: actions/checkout@v4
        with:
          # The deployment's commit when triggered by deployment_status
          # (the smoke script ships with the code it verifies); main for
          # manual runs.
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Live probes: A1 first-byte sections, version SHA, Y4 null-zero (B1; C6/C10; C2: runs for any production deployment state)"
        run: |
          echo "deployment state: ${{ github.event.deployment_status.state }} (smoke runs regardless — C2)"
          EXPECT="${{ github.event.inputs.expect_sha || github.event.deployment.sha || '' }}"
          # Only assert the just-deployed SHA when the deployment itself
          # succeeded; any other state leaves the previous build serving, so
          # the version check REPORTS the serving SHA instead of asserting.
          if [ "${{ github.event.deployment_status.state }}" = "success" ] && [ -n "$EXPECT" ]; then
            node scripts/ci/postDeploySmoke.mjs --expect-sha "$EXPECT"
          else
            node scripts/ci/postDeploySmoke.mjs
          fi
