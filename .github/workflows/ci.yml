# Remediation T17 — quality gates on every PR and push to main.
# Gates (all blocking): typecheck, lint, unit tests, encoding validation,
# registry validation, score parity, production build, gitleaks secret scan.
# R4 (round 2): the ESLint step is now honestly labelled and the warning
# ratchet actually RUNS in CI (lint:ratchet fails when the committed
# baseline is exceeded). The Playwright smoke job is non-blocking until it
# has been green for several runs (R10.6 tracks making it blocking).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "Repository hygiene (no .bak/backup/corrupted files in git)"
        run: |
          if git ls-files | grep -Ei '\.(bak|backup|tmp)$|corrupted'; then
            echo "::error::Backup/corrupted files tracked in git - delete them (Constitution forbids committed backups)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint (errors must be 0; no-explicit-any is an ERROR in app/api, lib/auth, lib/payments, lib/scoring, lib/chat)
        run: npx eslint .

      - name: ESLint warning ratchet (fails above the committed baseline)
        run: npm run lint:ratchet

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Encoding validation (T15)
        run: npm run validate:encoding

      - name: Registry validation (T12)
        # N1: registry/seed modules are server-only; tsx needs the
        # react-server condition so `import 'server-only'` resolves to its
        # no-op entry (matches package.json validate:stocks).
        run: npm run validate:stocks

      - name: Score parity (T10)
        run: npm run score:parity

      - name: Production build
        run: npm run build

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: Migrations & RLS invariants (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rishi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rishi_test
    steps:
      - uses: actions/checkout@v4

      - name: Apply Supabase-like harness (roles, auth schema, default grants)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/pg_harness.sql

      - name: Apply migrations 001…N in order
        run: |
          for f in $(ls lib/db/migrations/*.sql | sort); do
            echo "── applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Assert RLS invariants (N2)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/rls_invariants.sql

  smoke:
    name: Playwright smoke (blocking since round 2 — green on 4+ consecutive runs)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npx playwright test
