# Remediation T17 — quality gates on every PR and push to main.
# Gates (all blocking): typecheck, lint, unit tests, encoding validation,
# registry validation, score parity, production build, bundle budget,
# gitleaks secret scan, Postgres migration/RLS invariants.
# R4 (round 2): the ESLint step is honestly labelled and the warning
# ratchet RUNS in CI (lint:ratchet fails when the committed baseline is
# exceeded).
# R10.6 (round 2, closed): the Playwright smoke job IS blocking.
# N6 (round 3): the hygiene regex now matches timestamped backup names
# (foo.tsx.bak-20260515-1200) — the old '\.(bak|backup|tmp)$' missed them
# (verified by running it) — and the bundle budget runs after the build.
# Y1 (round 12): the ISR manifest gate runs after the production build —
# / and /stock/[symbol] must be baked with revalidate <= 60 s, never ƒ.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "Branch hygiene (Constitution v2 C7 — task token in the branch name and every commit subject; B-27 replaces the commit-scope registry)"
        if: github.event_name == 'pull_request'
        run: node scripts/ci/branchCheck.mjs "${{ github.head_ref }}"

      - name: "Deploy cadence report (C8 — push-time is report-only; the merge gate is the PR check; founder Round-16 C2)"
        if: github.event_name == 'push'
        run: node scripts/ci/deployCadence.mjs --report --base "origin/main"

      - name: "Deploy cadence gate (C8 — blocks the merge button inside the one-merge-per-hour window; founder Round-16 C2)"
        if: github.event_name == 'pull_request'
        run: node scripts/ci/deployCadence.mjs --pr --base "origin/main"

      - name: "Repository hygiene (no backup/corrupted/orig/rej files in git)"
        # N6 (round 3): the old pattern '\.(bak|backup|tmp)$' did NOT match
        # 'x.tsx.bak-20260515-1200' (verified by running it — the original
        # offender from the audit slipped through). Extended to timestamped
        # suffixes plus .orig/.rej conflict artifacts.
        run: |
          if git ls-files | grep -Ei '\.(bak|backup|tmp)([-._].*)?$|corrupted|\.orig$|\.rej$'; then
            echo "::error::Backup/corrupted/merge-artifact files tracked in git - delete them (Constitution forbids committed backups)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint (errors must be 0; no-explicit-any is an ERROR in app/api, lib/auth, lib/scoring, lib/chat)
        run: npx eslint .

      - name: ESLint warning ratchet (fails above the committed baseline)
        run: npm run lint:ratchet

      - name: Free-access audit (Commit M — no product dependency on tiers/payments)
        run: npm run freeAccessAudit

      - name: AI-loop architecture audit (Commit M — unified verified pipeline invariants)
        run: npm run aiLoopAudit

      - name: Route / internal-link integrity (Commit O — no dead internal links)
        run: npm run routeAudit

      - name: PROVENANCE.md drift gate (U5 — regeneration must match the committed doc)
        run: |
          npx tsx scripts/provenanceAudit.ts
          git diff --exit-code docs/PROVENANCE.md || (echo "::error::docs/PROVENANCE.md is stale — run provenanceAudit and commit the regenerated file" && exit 1)

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Encoding validation (T15)
        run: npm run validate:encoding

      - name: Registry validation (T12)
        # N1: registry/seed modules are server-only; tsx needs the
        # react-server condition so `import 'server-only'` resolves to its
        # no-op entry (matches package.json validate:stocks).
        run: npm run validate:stocks

      - name: Score parity (T10)
        run: npm run score:parity

      - name: i18n coverage gate (R4-06 — hi complete, 0 missing)
        run: npx tsx scripts/i18nCoverage.ts --locale=hi

      - name: Production build
        run: npm run build

      - name: ISR manifest gate (Y1 — / and /stock/[symbol] baked with revalidate <= 60 s)
        run: npm run verify:isr

      - name: Bundle budget (E6-02 ratchet; PROPOSED budgets reported)
        run: npm run bundle:budget

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: Migrations & RLS invariants (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rishi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: rishi_test
    steps:
      - uses: actions/checkout@v4

      - name: Apply Supabase-like harness (roles, auth schema, default grants)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/pg_harness.sql

      - name: Apply migrations 001…N in order
        run: |
          for f in $(ls lib/db/migrations/*.sql | sort); do
            echo "── applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Assert RLS invariants (N2)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/rls_invariants.sql

      - name: Assert quote-cache claim invariants (U2 — real-Postgres cold-claim proof)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/quote_cache_invariants.sql

      - name: Populate security master (D1-02, generated from the official NSE listing)
        run: psql -v ON_ERROR_STOP=1 -f data/security-master/populate.sql

      - name: Assert security master invariants (D1-02)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/security_master_invariants.sql

      - name: Assert SECURITY DEFINER EXECUTE lockdown (V1)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/security_definer_invariants.sql

      - name: Assert global spend reservation invariants (W3-A — boundary and settlement arithmetic)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/global_spend_invariants.sql

      - name: Prove the reservation hard bound under real concurrency (W3-A)
        run: |
          # 50 PARALLEL sessions each try to reserve 10 against a limit of
          # 100 on the same key. The WHERE-guarded upsert must admit
          # EXACTLY 10 (the limit divides cleanly) and refuse the other
          # 40 — 500 requested, 100 admitted, the counter never exceeds
          # the cap. Deterministic: the first 10 serialize on the row
          # lock and fit; every later session sees count=100.
          # E6-11 (raised from 24): this is the SQL-level form of the
          # roadmap acceptance "chat quota holds under 50 parallel
          # requests" — reserve_rate_limit is the same atomic upsert the
          # chat quota and the per-IP burst limiter ride.
          for i in $(seq 1 50); do
            psql -q -At -c "SELECT reserve_rate_limit('w3a:storm', 10, 100, 90000);" &
          done
          wait
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ DECLARE c int; BEGIN SELECT count INTO c FROM rate_limits WHERE key LIKE 'w3a:storm:%'; IF c IS DISTINCT FROM 100 THEN RAISE EXCEPTION 'CONCURRENCY FAILED: storm count must be exactly 100, got %', c; END IF; END \$\$;"
          psql -q -v ON_ERROR_STOP=1 -c "DELETE FROM rate_limits WHERE key LIKE 'w3a:storm:%';"

  smoke:
    name: Playwright smoke (blocking since round 2 — green on 4+ consecutive runs)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # U4: the smoke suite pins the ENABLED ranked surfaces (Top Buy
      # section + mandated seed banner). The flag must be present at BUILD
      # time (the homepage prerender bakes the rankings state — ISR serves
      # that prerender on the first hit) and at RUNTIME. The DISABLED state
      # is unit-pinned (flag matrix, i18n parity, source pins).
      RANKINGS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npx playwright test

  docker-space:
    name: Docker Space image (E1 — build, run, probe acceptance routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Space image (placeholder args — identical to the HF build)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="https://placeholder.supabase.co" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="ci-placeholder-anon-key" \
            --build-arg NEXT_PUBLIC_BASE_URL="" \
            -t rishi-terminal-space .

      - name: Image size (E2 measurement — raw output)
        run: docker images rishi-terminal-space --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Run the container exactly as the Space does
        run: docker run -d --name space -p 7860:7860 rishi-terminal-space

      - name: Wait for first response (cold-boot time, E2 measurement — raw output)
        run: |
          start=$(date +%s)
          code=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          end=$(date +%s)
          echo "first 200 after $((end - start)) s (last code: $code)"

      - name: Probe the four E1 acceptance routes (raw output)
        run: |
          for route in / /stocks /screener /stock/BANKBARODA /api/health; do
            echo "GET $route -> $(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7860$route")"
          done
          echo "--- /api/health body (no DB env — honest degraded verdict):"
          curl -s http://127.0.0.1:7860/api/health; echo

      - name: Assert E1 acceptance statuses
        run: |
          # SR: /screener 308-redirects to /stocks (next.config) — probe both, assert both.
          for route in / /stocks /stock/BANKBARODA; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7860$route")
            if [ "$code" != "200" ]; then
              echo "::error::E1 acceptance failed: $route returned $code, expected 200"
              exit 1
            fi
          done
          # The Space runs seed-only (no DB env, per the founder's staging
          # rule): /api/health must still answer, honestly reporting its
          # degraded verdict as 503 — fail closed (Constitution C2). A 200
          # here would mean a database was silently attached.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/api/health)
          if [ "$code" != "503" ]; then
            echo "::error::/api/health returned $code, expected the honest degraded 503 (seed-only staging)"
            exit 1
          fi

  lighthouse:
    name: Lighthouse gate (U3 — measured-score floors, ratchet)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (provides the Chrome binary Lighthouse drives)
        run: npx playwright install --with-deps chromium

      - name: Export CHROME_PATH (Playwright's chromium)
        run: echo "CHROME_PATH=$(find ~/.cache/ms-playwright -name chrome -path '*chrome-linux64*' | head -1)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Lighthouse gate (warm server, audit /, /stocks, /stock/RELIANCE, assert floors)
        run: npm run lhci

      - name: Upload raw Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
